server {
    listen 192.168.127.10:80;
    server_name 192.168.127.10;

    root /home/sunrise/WaterSter/web;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Forward each camera JPEG immediately instead of accumulating a buffer.
    location = /stream.mjpg {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        gzip off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ @waterster_backend;
    }

    # Route future application endpoints through this same public entry point.
    location @waterster_backend {
        proxy_pass http://127.0.0.1:8080;
    }
}
